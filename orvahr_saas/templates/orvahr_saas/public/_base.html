{% load i18n %}<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}OrvaHR{% endblock %}</title>
<style>
  :root{--ink:#1f2933;--muted:#52606d;--line:#e4e7eb;--bg:#f6f7f9;--card:#fff;--brand:#e8590c;--brand-ink:#fff;--ok:#2f855a;--bad:#c53030}
  *{box-sizing:border-box}
  body{font-family:"Noto Sans Thai","Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);margin:0;line-height:1.55}
  header,footer{padding:16px;max-width:1080px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  header a.brand{font-weight:700;font-size:1.25rem;color:var(--ink);text-decoration:none}
  main{max-width:1080px;margin:0 auto;padding:0 16px 48px}
  h1{font-size:2rem;margin:24px 0 8px} h2{font-size:1.3rem;margin:32px 0 12px}
  p{color:var(--muted);margin:0 0 10px}
  .btn{display:inline-block;background:var(--brand);color:var(--brand-ink);border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:600;text-decoration:none;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
  .price{font-size:1.2rem;font-weight:700;margin:8px 0}
  ul.features{padding-left:18px;margin:8px 0 16px;color:var(--muted)}
  form .field{margin-bottom:14px} label{display:block;font-weight:600;margin-bottom:4px}
  input[type=text],input[type=email],input[type=number],input[type=tel],input[type=password],select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
  .help{font-size:.88rem;color:var(--muted)} .error,.errorlist{color:var(--bad);font-size:.9rem;list-style:none;padding:0;margin:4px 0}
  .ok{color:var(--ok)} .bad{color:var(--bad)}
  .slug-row{display:flex;align-items:center;gap:6px} .slug-row input{flex:1}
  .hp{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
  .lang form{display:inline} .lang button{background:none;border:0;color:var(--muted);cursor:pointer;font:inherit;padding:4px}
  .lang button[aria-current=true]{color:var(--ink);font-weight:700}
</style>
</head>
<body>
<header>
  <a class="brand" href="/">OrvaHR</a>
  <nav class="lang" aria-label="{% translate 'Language' %}">
    <form action="/i18n/setlang/" method="post">
      <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ request_path }}">
      <button name="language" value="th" {% if LANGUAGE_CODE|slice:":2" == "th" %}aria-current="true"{% endif %}>ไทย</button>
      <button name="language" value="en" {% if LANGUAGE_CODE|slice:":2" != "th" %}aria-current="true"{% endif %}>English</button>
    </form>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer><p>&copy; OrvaHR</p></footer>
{% block scripts %}{% endblock %}
</body>
</html>
