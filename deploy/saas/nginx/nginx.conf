# OrvaHR SaaS internal reverse proxy (mounted by docker-compose.saas.yml).
#
# Sits behind cloudflared (or kgf-caddy, see RUNBOOK) on the internal "edge"
# network and in front of gunicorn. Server blocks are rendered from
# templates/orvahr.conf.template by the nginx image's envsubst step, so the
# base domain and the edge subnet come from .env.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    # Docker's embedded DNS. Upstreams are resolved per request (see the
    # template) so recreating `web` during an update never leaves nginx
    # pointing at a dead container IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format orvahr '$remote_addr - $remote_user [$time_local] "$host" '
                      '"$request" $status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time cf_ray=$http_cf_ray';
    access_log /dev/stdout orvahr;
    error_log /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # Login rate limit, as in docker/nginx.conf. Keyed on $binary_remote_addr,
    # which the realip module (template) has already set to the real client
    # address from CF-Connecting-IP. Without that every login on every tenant
    # would share cloudflared's single address and one 5 r/m bucket.
    map $request_method $horilla_login_limit_key {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $horilla_login_limit_key zone=horilla_login:10m rate=5r/m;
    limit_req_status 429;

    include /etc/nginx/conf.d/orvahr.conf;
}
