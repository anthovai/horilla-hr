[package]
name = "orvahr-payroll-engine"
version = "0.1.0"
edition = "2021"
description = "OrvaHR Thai payroll rules engine: income tax, withholding and social security. All rates are data (rules/*.json), never code."

[lib]
name = "payroll_engine"
path = "src/lib.rs"

[[bin]]
name = "payroll-engine"
path = "src/main.rs"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
