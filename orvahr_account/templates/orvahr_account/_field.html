<div class="mb-3">
    <label class="block text-sm font-medium mb-1" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} *{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<div class="text-xs text-gray-500 mt-1">{{ field.help_text }}</div>{% endif %}
    {% for error in field.errors %}<div class="text-xs text-red-600 mt-1">{{ error }}</div>{% endfor %}
</div>
