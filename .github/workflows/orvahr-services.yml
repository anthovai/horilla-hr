# Gates for the OrvaHR side services (Rust payroll engine and face-verify, Go
# exports) and the Svelte web app. Runs only when one of them (or this file) changes.
# The Rust tests also parse every bundled services/payroll-engine/rules/*.json,
# so no separate rules-validation job is needed.

name: OrvaHR Services

on:
  push:
    branches: [dev/v2.0, "2.0"]
    paths:
      - "services/**"
      - "web/**"
      - ".github/workflows/orvahr-services.yml"
  pull_request:
    branches: [dev/v2.0, "2.0"]
    paths:
      - "services/**"
      - "web/**"
      - ".github/workflows/orvahr-services.yml"

permissions:
  contents: read

concurrency:
  group: orvahr-services-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payroll-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/payroll-engine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/payroll-engine/target
          key: cargo-${{ runner.os }}-${{ hashFiles('services/payroll-engine/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: rustfmt
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests (includes bundled rules parsing)
        run: cargo test --locked

  face-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/face-verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/face-verify/target
          key: cargo-face-${{ runner.os }}-${{ hashFiles('services/face-verify/Cargo.lock') }}
          restore-keys: |
            cargo-face-${{ runner.os }}-

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: |
            services/face-verify/models/yunet_2023mar.onnx
            services/face-verify/models/sface_2021dec.onnx
          key: face-models-${{ hashFiles('services/face-verify/models/fetch.sh') }}

      # Verifies SHA-256 of cached files too, so a stale cache cannot slip in.
      - name: Fetch models
        run: ./models/fetch.sh

      - name: rustfmt
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests (unit + end-to-end on the real models)
        run: cargo test --locked

  exports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/exports

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/exports/go.mod
          cache-dependency-path: services/exports/go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun test

      - name: Type check
        run: bun run check

      - name: Build
        run: bun run build
