server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Payroll engine: strip the /engine prefix, as the Vite dev proxy does.
    # Resolved at request time so nginx starts even if the engine is down.
    location /engine/ {
        resolver 127.0.0.11 valid=10s;
        set $engine http://payroll-engine:8090;
        rewrite ^/engine/(.*)$ /$1 break;
        proxy_pass $engine;
        proxy_set_header Host $host;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
