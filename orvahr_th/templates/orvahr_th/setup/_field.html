{# One form field: label, widget, help text, errors. Context: field. #}
<div class="{{ field_class|default:'' }}">
    {% if field.field.widget.input_type == 'checkbox' %}
        <label class="flex items-start gap-2 text-sm" for="{{ field.id_for_label }}">
            {{ field }} <span>{{ field.label }}</span>
        </label>
    {% else %}
        <label class="oh-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-red-600">*</span>{% endif %}</label>
        {{ field }}
    {% endif %}
    {% if field.help_text %}<p class="text-xs text-gray-500 mt-1">{{ field.help_text }}</p>{% endif %}
    {% for error in field.errors %}<p class="text-xs text-red-600 mt-1">{{ error }}</p>{% endfor %}
</div>
